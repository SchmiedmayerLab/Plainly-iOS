<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Conversation Feedback</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --panel-2: #f8f9fb;
    --border: #e2e5ea;
    --border-strong: #cfd4dc;
    --text: #1c2230;
    --muted: #66707f;
    --accent: #2f6df6;
    --accent-soft: #e8f0ff;
    --user-bg: #eef2f8;
    --assistant-bg: #ffffff;
    --good: #1f9d57;
    --bad: #d64545;
    --highlight: #fff2a8;
    --highlight-active: #ffe066;
    --shadow: 0 1px 2px rgba(20, 28, 45, 0.06), 0 4px 16px rgba(20, 28, 45, 0.06);
    --radius: 10px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --panel: #1a1f29;
      --panel-2: #20262f;
      --border: #2c333f;
      --border-strong: #3a4250;
      --text: #e7ebf2;
      --muted: #97a1b2;
      --accent: #5b8cff;
      --accent-soft: #22304d;
      --user-bg: #232a36;
      --assistant-bg: #1a1f29;
      --highlight: #6a5a1a;
      --highlight-active: #93791f;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  a { color: var(--accent); }

  /* ---------- Layout ---------- */
  header.app {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .header-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 12px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px 18px;
    align-items: center;
  }
  .brand {
    font-weight: 700;
    font-size: 16px;
    margin-right: 6px;
    white-space: nowrap;
  }
  .brand small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }
  .reviewer-fields { display: flex; gap: 8px; flex-wrap: wrap; }
  .reviewer-fields input {
    padding: 7px 10px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--panel-2);
    color: var(--text);
    font-size: 13px;
    min-width: 150px;
  }
  .header-spacer { flex: 1 1 auto; }
  .progress-chip {
    font-size: 12.5px;
    color: var(--muted);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px;
    white-space: nowrap;
  }
  .progress-chip b { color: var(--text); }
  .btn {
    border: 1px solid var(--border-strong);
    background: var(--panel-2);
    color: var(--text);
    padding: 7px 13px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.ghost { background: transparent; }
  .saved-note { font-size: 11.5px; color: var(--muted); white-space: nowrap; }

  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px;
    display: grid;
    grid-template-columns: 232px 1fr;
    gap: 22px;
    align-items: start;
  }

  /* ---------- Sidebar ---------- */
  nav.convs {
    position: sticky;
    top: 78px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    max-height: calc(100vh - 100px);
    display: flex;
    flex-direction: column;
  }
  nav.convs .nav-head {
    padding: 10px 12px;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  nav.convs .conv-list { overflow-y: auto; }
  .conv-item {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .conv-item:hover { background: var(--panel-2); }
  .conv-item.active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .conv-item .c-title { font-weight: 600; font-size: 13px; }
  .conv-item .c-sub { font-size: 11.5px; color: var(--muted); }
  .conv-item .c-count { font-size: 11.5px; color: var(--muted); }
  .conv-item .c-count b { color: var(--good); }

  .dropzone {
    margin: 10px;
    border: 1.5px dashed var(--border-strong);
    border-radius: 8px;
    padding: 12px;
    text-align: center;
    font-size: 11.5px;
    color: var(--muted);
    cursor: pointer;
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  /* ---------- Content ---------- */
  section.content { min-width: 0; }
  .conv-header {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 18px;
    margin-bottom: 16px;
  }
  .conv-header h1 { margin: 0 0 4px; font-size: 18px; }
  .conv-header .meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .conv-header .meta code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }

  details.sys, details.ctx, details.resources {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel-2);
    margin-top: 10px;
  }
  details.sys > summary, details.ctx > summary, details.resources > summary {
    cursor: pointer;
    padding: 8px 12px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    list-style: none;
  }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: "▸ "; color: var(--muted); }
  details[open] > summary::before { content: "▾ "; }
  .details-body { padding: 4px 14px 12px; font-size: 13px; }

  .turn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 18px;
    overflow: hidden;
  }
  .turn-index {
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 8px 18px 0;
  }
  .msg { padding: 6px 18px 12px; }
  .msg .role {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .msg.user { background: var(--user-bg); padding-top: 12px; }
  .msg.user .bubble { font-weight: 500; }
  .bubble {
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .answer-bubble { position: relative; }
  mark.anno {
    background: var(--highlight);
    border-radius: 2px;
    padding: 0 1px;
    cursor: pointer;
    box-shadow: inset 0 -2px 0 var(--highlight-active);
  }
  mark.anno.focus { background: var(--highlight-active); }

  .feedback {
    border-top: 1px solid var(--border);
    background: var(--panel-2);
    padding: 14px 18px 16px;
  }
  .fb-row { margin-bottom: 12px; }
  .fb-row:last-child { margin-bottom: 0; }
  .fb-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 5px;
  }
  .fb-label .opt { font-weight: 500; color: var(--muted); }

  .satisfaction { display: flex; flex-wrap: wrap; gap: 6px; }
  .sat-btn {
    border: 1px solid var(--border-strong);
    background: var(--panel);
    color: var(--muted);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 12.5px;
    cursor: pointer;
  }
  .sat-btn:hover { border-color: var(--accent); }
  .sat-btn.on {
    color: #fff;
    border-color: transparent;
  }
  .sat-btn.on[data-v="very dissatisfied"] { background: #b3261e; }
  .sat-btn.on[data-v="dissatisfied"] { background: #d97706; }
  .sat-btn.on[data-v="neutral"] { background: #6b7280; }
  .sat-btn.on[data-v="satisfied"] { background: #2f9e44; }
  .sat-btn.on[data-v="very satisfied"] { background: #1f7a34; }

  textarea.fb {
    width: 100%;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    padding: 8px 10px;
    font: inherit;
    font-size: 13.5px;
    resize: vertical;
    min-height: 42px;
  }
  textarea.fb:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .fb-two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .anno-list { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .anno-chip {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    font-size: 12.5px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--highlight-active);
    border-radius: 6px;
    padding: 6px 8px;
  }
  .anno-chip .quote { color: var(--muted); font-style: italic; }
  .anno-chip .cmt { flex: 1; }
  .anno-chip .del { color: var(--bad); cursor: pointer; font-weight: 700; border: none; background: none; font-size: 14px; line-height: 1; }

  .ctx-call { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; margin: 6px 0; overflow-x: auto; }
  .ctx-summary { white-space: pre-wrap; font-size: 12.5px; color: var(--text); border-left: 3px solid var(--border-strong); padding-left: 10px; margin: 6px 0; }
  .res-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .res-table th, .res-table td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); }
  .res-table th { color: var(--muted); font-weight: 600; }

  /* Annotation popover */
  .anno-pop {
    position: absolute;
    z-index: 50;
    background: var(--panel);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 10px;
    width: 280px;
  }
  .anno-pop textarea {
    width: 100%; border: 1px solid var(--border-strong); border-radius: 6px;
    background: var(--panel-2); color: var(--text); font: inherit; font-size: 13px;
    padding: 6px 8px; min-height: 60px; resize: vertical;
  }
  .anno-pop .pop-quote { font-size: 11.5px; color: var(--muted); font-style: italic; margin-bottom: 6px; max-height: 48px; overflow: auto; }
  .anno-pop .pop-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }

  .empty {
    max-width: 560px;
    margin: 60px auto;
    text-align: center;
    color: var(--muted);
  }
  .empty h2 { color: var(--text); }
  .empty .big-drop {
    margin-top: 20px;
    border: 2px dashed var(--border-strong);
    border-radius: 12px;
    padding: 40px 20px;
    cursor: pointer;
  }
  .empty .big-drop.drag { border-color: var(--accent); background: var(--accent-soft); }

  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
    nav.convs { position: static; max-height: none; }
    .fb-two { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header class="app">
  <div class="header-inner">
    <div class="brand">Conversation Feedback<small>SpineAI / Plainly review</small></div>
    <div class="reviewer-fields">
      <input id="reviewerName" type="text" placeholder="Your name" autocomplete="name" aria-label="Your name" />
      <input id="reviewerEmail" type="email" placeholder="Your email" autocomplete="email" aria-label="Your email" />
    </div>
    <div class="header-spacer"></div>
    <span class="progress-chip" id="progressChip">0 / 0 answered</span>
    <span class="saved-note" id="savedNote"></span>
    <button class="btn ghost" id="importBtn">Import…</button>
    <button class="btn primary" id="exportBtn">Export JSON</button>
    <input id="importFile" type="file" accept="application/json,.json" hidden />
    <input id="addFile" type="file" accept="application/json,.json" multiple hidden />
  </div>
</header>

<main id="app"></main>

<!--
  Conversations are embedded here by build.ts as an array of { id, report }.
  `report` is the raw StudyReport JSON. Reviewers can also drag more files onto the page.
-->
<script id="conversations-data" type="application/json">[]</script>

<script>
"use strict";
(function () {
  const SAT_OPTIONS = ["very dissatisfied", "dissatisfied", "neutral", "satisfied", "very satisfied"];
  const SCHEMA_VERSION = 1;
  const STORAGE_PREFIX = "convFeedback:v1:";

  // ---------- State ----------
  /** conversations: [{ id, patient, studyID, model, temperature, startTime, systemPrompt, resources, turns:[{index, question, questionTs, answer, answerTs, context:[...]}] }] */
  let conversations = [];
  /** feedback keyed by conversationId -> answerIndex -> {satisfaction, whatWasGood, whatWasBad, resourcesToMention, furtherComments, inlineAnnotations:[]} */
  let feedback = {};
  let reviewer = { name: "", email: "" };
  let activeConvId = null;
  let storageKey = STORAGE_PREFIX + "default";

  // ---------- Utilities ----------
  const $ = (sel, root) => (root || document).querySelector(sel);
  const el = (tag, props, children) => {
    const n = document.createElement(tag);
    if (props) for (const k in props) {
      if (k === "class") n.className = props[k];
      else if (k === "html") n.innerHTML = props[k];
      else if (k === "text") n.textContent = props[k];
      else if (k.startsWith("on") && typeof props[k] === "function") n.addEventListener(k.slice(2), props[k]);
      else if (props[k] != null) n.setAttribute(k, props[k]);
    }
    if (children) for (const c of [].concat(children)) if (c != null) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    return n;
  };
  const metaField = (label, value) => el("span", {}, [label + " ", el("code", { text: value })]);
  const basename = (p) => (p ? String(p).split("/").pop().replace(/\.[^.]+$/, "") : "");
  const hashStr = (s) => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };

  // Apple's reference date (2001-01-01) — StudyReport timestamps are seconds since then.
  const APPLE_EPOCH_MS = Date.UTC(2001, 0, 1);
  const fmtTime = (t) => {
    if (typeof t !== "number") return "";
    const ms = t > 1e11 ? t : APPLE_EPOCH_MS + t * 1000; // support raw unix too
    try { return new Date(ms).toLocaleString(); } catch { return ""; }
  };

  // ---------- Parser: StudyReport -> review model ----------
  function parseReport(id, report) {
    const md = report && report.metadata ? report.metadata : {};
    const timeline = Array.isArray(report && report.timeline) ? report.timeline : [];
    const messages = timeline
      .filter((t) => t && t.type === "chatMessage" && t.data)
      .map((t) => t.data);

    let systemPrompt = "";
    const turns = [];
    let current = null; // open turn awaiting an assistant answer
    let pendingContext = [];

    for (const m of messages) {
      const role = m.role;
      if (role === "hidden_system") {
        if (!systemPrompt) systemPrompt = m.content || "";
      } else if (role === "user") {
        // finalize any dangling user without an answer
        current = { index: turns.length, question: m.content || "", questionTs: m.timestamp, answer: null, answerTs: null, context: [] };
        pendingContext = [];
        turns.push(current);
      } else if (role === "hidden_assistantToolCall") {
        pendingContext.push({ kind: "toolCall", content: m.content || "" });
      } else if (role === "hidden_function") {
        pendingContext.push({ kind: "function", content: m.content || "" });
      } else if (role === "assistant") {
        if (current && current.answer == null) {
          current.answer = m.content || "";
          current.answerTs = m.timestamp;
          current.context = pendingContext;
          pendingContext = [];
          current = null;
        } else {
          // assistant without a preceding open user turn — attach as its own turn
          turns.push({ index: turns.length, question: "(no user prompt)", questionTs: m.timestamp, answer: m.content || "", answerTs: m.timestamp, context: pendingContext });
          pendingContext = [];
        }
      }
    }

    const resources = (report && report.fhirResources && Array.isArray(report.fhirResources.allResources))
      ? report.fhirResources.allResources
      : [];

    const comment = (md.userInfo && typeof md.userInfo.comment === "string") ? md.userInfo.comment.trim() : "";
    const patient = basename(md.userInfo && md.userInfo.bundle) || id;
    return {
      id,
      patient,
      comment,
      // prefer the session's free-form comment as the display title; fall back to patient bundle
      title: comment || patient,
      studyID: md.studyID || "",
      model: md.llmConfig && md.llmConfig.model != null ? String(md.llmConfig.model) : "",
      temperature: md.llmConfig ? md.llmConfig.temperature : undefined,
      startTime: md.startTime,
      patientBundle: (md.userInfo && md.userInfo.bundle) || "",
      systemPrompt,
      resources,
      // only turns that actually have an answer are reviewable
      turns: turns.filter((t) => t.answer != null).map((t, i) => ({ ...t, index: i })),
    };
  }

  function addReports(list) {
    // list: [{ id, report }]
    const existing = new Set(conversations.map((c) => c.id));
    let added = 0;
    for (const item of list) {
      if (!item || !item.report) continue;
      let id = item.id || ("conversation-" + (conversations.length + 1));
      // de-dupe id
      if (existing.has(id)) {
        let n = 2;
        while (existing.has(id + "-" + n)) n++;
        id = id + "-" + n;
      }
      try {
        const conv = parseReport(id, item.report);
        conversations.push(conv);
        existing.add(id);
        added++;
      } catch (e) {
        console.error("Failed to parse report", id, e);
      }
    }
    if (added) {
      recomputeStorageKey();
      loadFeedback();
      if (!activeConvId) activeConvId = conversations[0].id;
    }
    return added;
  }

  // ---------- Feedback model ----------
  function blankAnswerFb() {
    return { satisfaction: null, whatWasGood: "", whatWasBad: "", resourcesToMention: "", furtherComments: "", inlineAnnotations: [] };
  }
  function getFb(convId, idx) {
    feedback[convId] = feedback[convId] || {};
    if (!feedback[convId][idx]) feedback[convId][idx] = blankAnswerFb();
    return feedback[convId][idx];
  }
  function answerIsAnswered(fb) {
    return !!(fb && (fb.satisfaction || (fb.whatWasGood || "").trim() || (fb.whatWasBad || "").trim() ||
      (fb.resourcesToMention || "").trim() || (fb.furtherComments || "").trim() || (fb.inlineAnnotations && fb.inlineAnnotations.length)));
  }
  function convCounts(conv) {
    const fbc = feedback[conv.id] || {};
    let done = 0;
    for (let i = 0; i < conv.turns.length; i++) if (answerIsAnswered(fbc[i])) done++;
    return { done, total: conv.turns.length };
  }
  function totalCounts() {
    let done = 0, total = 0;
    for (const c of conversations) { const cc = convCounts(c); done += cc.done; total += cc.total; }
    return { done, total };
  }

  // ---------- Persistence ----------
  function recomputeStorageKey() {
    const ids = conversations.map((c) => c.id).sort().join("|");
    storageKey = STORAGE_PREFIX + hashStr(ids || "empty");
  }
  let saveTimer = null;
  function scheduleSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 300);
    const note = $("#savedNote");
    if (note) note.textContent = "saving…";
  }
  function saveNow() {
    try {
      localStorage.setItem(storageKey, JSON.stringify({ reviewer, feedback, savedAt: Date.now() }));
      const note = $("#savedNote");
      if (note) note.textContent = "saved " + new Date().toLocaleTimeString();
    } catch (e) {
      const note = $("#savedNote");
      if (note) note.textContent = "save failed (storage full?)";
      console.error(e);
    }
  }
  function loadFeedback() {
    try {
      const raw = localStorage.getItem(storageKey);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (data.reviewer && !reviewer.name && !reviewer.email) reviewer = data.reviewer;
      if (data.feedback) {
        // merge without clobbering anything already in memory
        for (const cid in data.feedback) {
          feedback[cid] = Object.assign({}, data.feedback[cid], feedback[cid] || {});
        }
      }
    } catch (e) { console.error("loadFeedback failed", e); }
  }

  // ---------- Export / Import ----------
  function buildExport() {
    return {
      schemaVersion: SCHEMA_VERSION,
      exportedAt: new Date().toISOString(),
      reviewer: { name: reviewer.name || "", email: reviewer.email || "" },
      conversations: conversations.map((conv) => ({
        conversationId: conv.id,
        comment: conv.comment || "",
        studyID: conv.studyID,
        patientBundle: conv.patientBundle,
        model: conv.model,
        answers: conv.turns.map((t) => {
          const fb = getFb(conv.id, t.index);
          return {
            index: t.index,
            question: t.question,
            answer: t.answer,
            satisfaction: fb.satisfaction || null,
            whatWasGood: fb.whatWasGood || "",
            whatWasBad: fb.whatWasBad || "",
            resourcesToMention: fb.resourcesToMention || "",
            furtherComments: fb.furtherComments || "",
            inlineAnnotations: (fb.inlineAnnotations || []).map((a) => ({ quote: a.quote, start: a.start, end: a.end, comment: a.comment })),
          };
        }),
      })),
    };
  }
  function doExport() {
    const data = buildExport();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
    const namePart = (reviewer.name || "reviewer").trim().replace(/[^a-z0-9]+/gi, "-").replace(/^-+|-+$/g, "").toLowerCase() || "reviewer";
    const a = el("a", { href: url, download: `conversation-feedback-${namePart}-${stamp}.json` });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function importExport(data) {
    if (!data || !Array.isArray(data.conversations)) { alert("Not a valid feedback export file."); return; }
    if (data.reviewer) {
      reviewer = { name: data.reviewer.name || "", email: data.reviewer.email || "" };
    }
    for (const c of data.conversations) {
      if (!c || !c.conversationId) continue;
      feedback[c.conversationId] = feedback[c.conversationId] || {};
      for (const a of (c.answers || [])) {
        feedback[c.conversationId][a.index] = {
          satisfaction: a.satisfaction || null,
          whatWasGood: a.whatWasGood || "",
          whatWasBad: a.whatWasBad || "",
          resourcesToMention: a.resourcesToMention || "",
          furtherComments: a.furtherComments || "",
          inlineAnnotations: Array.isArray(a.inlineAnnotations) ? a.inlineAnnotations.slice() : [],
        };
      }
    }
    saveNow();
    renderAll();
  }

  // ---------- Inline annotation ----------
  let openPop = null;
  function closePop() { if (openPop) { openPop.remove(); openPop = null; } }

  function renderAnswerWithAnnotations(text, annotations) {
    const wrap = el("div", { class: "bubble answer-bubble" });
    const anns = (annotations || []).slice().sort((a, b) => a.start - b.start);
    // guard against overlaps / stale offsets by validating against current text
    let cursor = 0;
    for (const a of anns) {
      if (typeof a.start !== "number" || typeof a.end !== "number" || a.start < cursor || a.end > text.length || a.start >= a.end) continue;
      if (a.start > cursor) wrap.appendChild(document.createTextNode(text.slice(cursor, a.start)));
      const m = el("mark", { class: "anno", title: a.comment || "" }, text.slice(a.start, a.end));
      m.addEventListener("click", (ev) => { ev.stopPropagation(); focusAnnotation(wrap, a); });
      m._anno = a;
      wrap.appendChild(m);
      cursor = a.end;
    }
    if (cursor < text.length) wrap.appendChild(document.createTextNode(text.slice(cursor)));
    return wrap;
  }

  function focusAnnotation(container, a) {
    container.querySelectorAll("mark.anno").forEach((mk) => mk.classList.toggle("focus", mk._anno === a));
    const chip = container.parentElement && container.parentElement.querySelector(`[data-anno-id="${a._id}"]`);
    if (chip) { chip.scrollIntoView({ block: "nearest" }); chip.style.transition = "background .3s"; chip.style.background = "var(--accent-soft)"; setTimeout(() => (chip.style.background = ""), 600); }
  }

  function attachSelectionHandler(bubble, conv, turn) {
    bubble.addEventListener("mouseup", () => {
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed || sel.rangeCount === 0) return;
      const range = sel.getRangeAt(0);
      if (!bubble.contains(range.startContainer) || !bubble.contains(range.endContainer)) return;
      const offsets = selectionOffsetsWithin(bubble, range);
      if (!offsets || offsets.start >= offsets.end) return;
      const quote = turn.answer.slice(offsets.start, offsets.end);
      openAnnotationPopover(bubble, conv, turn, offsets.start, offsets.end, quote, range);
    });
  }

  // Compute char offsets of a range relative to the plain text of `root`.
  function selectionOffsetsWithin(root, range) {
    const start = charIndexOf(root, range.startContainer, range.startOffset);
    const end = charIndexOf(root, range.endContainer, range.endOffset);
    if (start == null || end == null) return null;
    return { start: Math.min(start, end), end: Math.max(start, end) };
  }
  function charIndexOf(root, node, offset) {
    let count = 0;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    let n;
    while ((n = walker.nextNode())) {
      if (n === node) return count + offset;
      count += n.nodeValue.length;
    }
    // node might be an element (e.g. the mark) — fall back
    return null;
  }

  function openAnnotationPopover(bubble, conv, turn, start, end, quote, range) {
    closePop();
    const rect = range.getBoundingClientRect();
    const hostRect = bubble.getBoundingClientRect();
    const pop = el("div", { class: "anno-pop" });
    pop.style.top = (rect.bottom - hostRect.top + 6) + "px";
    pop.style.left = Math.max(0, Math.min(rect.left - hostRect.left, bubble.clientWidth - 290)) + "px";
    const ta = el("textarea", { placeholder: "Your note on this passage…" });
    pop.appendChild(el("div", { class: "pop-quote", text: "“" + quote.slice(0, 200) + (quote.length > 200 ? "…" : "") + "”" }));
    pop.appendChild(ta);
    const actions = el("div", { class: "pop-actions" });
    actions.appendChild(el("button", { class: "btn ghost", onclick: () => { closePop(); window.getSelection().removeAllRanges(); } }, "Cancel"));
    actions.appendChild(el("button", { class: "btn primary", onclick: () => {
      const comment = ta.value.trim();
      if (!comment) { ta.focus(); return; }
      const fb = getFb(conv.id, turn.index);
      fb.inlineAnnotations.push({ _id: "a" + Date.now() + Math.random().toString(36).slice(2, 6), quote, start, end, comment });
      closePop();
      window.getSelection().removeAllRanges();
      scheduleSave();
      renderContent();
    } }, "Add note"));
    pop.appendChild(actions);
    bubble.appendChild(pop);
    openPop = pop;
    ta.focus();
  }

  document.addEventListener("mousedown", (e) => { if (openPop && !openPop.contains(e.target)) closePop(); });

  // ---------- Rendering ----------
  function renderAll() {
    // sync reviewer inputs
    $("#reviewerName").value = reviewer.name || "";
    $("#reviewerEmail").value = reviewer.email || "";
    renderApp();
    renderProgress();
  }

  function renderApp() {
    const app = $("#app");
    app.innerHTML = "";
    if (!conversations.length) {
      app.style.display = "block";
      app.appendChild(renderEmpty());
      return;
    }
    app.style.display = "grid";
    app.appendChild(renderSidebar());
    const content = el("section", { class: "content", id: "content" });
    app.appendChild(content);
    renderContent();
  }

  function renderEmpty() {
    const wrap = el("div", { class: "empty" });
    wrap.appendChild(el("h2", { text: "No conversations loaded" }));
    wrap.appendChild(el("p", { text: "Drop StudyReport JSON files here (the NN-session-1.json exports), or use a build that has them embedded." }));
    const drop = el("div", { class: "big-drop", text: "Drag & drop conversation JSON files here, or click to choose" });
    drop.addEventListener("click", () => $("#addFile").click());
    wireDrop(drop);
    wrap.appendChild(drop);
    return wrap;
  }

  function renderSidebar() {
    const nav = el("nav", { class: "convs" });
    nav.appendChild(el("div", { class: "nav-head", text: `Conversations (${conversations.length})` }));
    const list = el("div", { class: "conv-list" });
    for (const conv of conversations) {
      const cc = convCounts(conv);
      const item = el("div", { class: "conv-item" + (conv.id === activeConvId ? " active" : "") });
      item.addEventListener("click", () => { activeConvId = conv.id; renderApp(); window.scrollTo({ top: 0 }); });
      item.appendChild(el("div", { class: "c-title", text: conv.title }));
      item.appendChild(el("div", { class: "c-sub", text: conv.comment ? conv.patient + " · " + conv.id : conv.id }));
      item.appendChild(el("div", { class: "c-count", html: `<b>${cc.done}</b> / ${cc.total} answered` }));
      list.appendChild(item);
    }
    nav.appendChild(list);
    const drop = el("div", { class: "dropzone", text: "+ Add conversation files" });
    drop.addEventListener("click", () => $("#addFile").click());
    wireDrop(drop);
    nav.appendChild(drop);
    return nav;
  }

  function renderContent() {
    const content = $("#content");
    if (!content) return;
    content.innerHTML = "";
    const conv = conversations.find((c) => c.id === activeConvId);
    if (!conv) return;

    // header
    const head = el("div", { class: "conv-header" });
    head.appendChild(el("h1", { text: conv.title }));
    const meta = el("div", { class: "meta" });
    meta.appendChild(metaField("Conversation", conv.id));
    if (conv.comment) meta.appendChild(metaField("Patient", conv.patient));
    if (conv.studyID) meta.appendChild(metaField("Study", conv.studyID));
    if (conv.model) meta.appendChild(metaField("Model", conv.model));
    if (conv.startTime != null) meta.appendChild(el("span", { text: "Started " + fmtTime(conv.startTime) }));
    meta.appendChild(el("span", { text: `${conv.turns.length} answers to review` }));
    head.appendChild(meta);
    if (conv.systemPrompt) {
      const sys = el("details", { class: "sys" });
      sys.appendChild(el("summary", { text: "System prompt" }));
      sys.appendChild(el("div", { class: "details-body" }, el("div", { class: "bubble", text: conv.systemPrompt })));
      head.appendChild(sys);
    }
    if (conv.resources && conv.resources.length) {
      const res = el("details", { class: "resources" });
      res.appendChild(el("summary", { text: `Patient FHIR resources (${conv.resources.length})` }));
      const body = el("div", { class: "details-body" });
      const table = el("table", { class: "res-table" });
      table.appendChild(el("tr", {}, [el("th", { text: "Type" }), el("th", { text: "Name" }), el("th", { text: "Date" })]));
      for (const r of conv.resources) {
        table.appendChild(el("tr", {}, [
          el("td", { text: r.resourceType || "" }),
          el("td", { text: r.displayName || "" }),
          el("td", { text: r.dateDescription || "" }),
        ]));
      }
      body.appendChild(table);
      res.appendChild(body);
      head.appendChild(res);
    }
    content.appendChild(head);

    // turns
    for (const turn of conv.turns) content.appendChild(renderTurn(conv, turn));
  }

  function renderTurn(conv, turn) {
    const fb = getFb(conv.id, turn.index);
    const card = el("div", { class: "turn" });
    card.appendChild(el("div", { class: "turn-index", text: `Answer ${turn.index + 1} of ${conv.turns.length}` }));

    // user question
    const uMsg = el("div", { class: "msg user" });
    uMsg.appendChild(el("div", { class: "role", text: "Question" }));
    uMsg.appendChild(el("div", { class: "bubble", text: turn.question }));
    card.appendChild(uMsg);

    // assistant answer with annotations
    const aMsg = el("div", { class: "msg assistant" });
    aMsg.appendChild(el("div", { class: "role", text: "SpineAI answer" }));
    const bubble = renderAnswerWithAnnotations(turn.answer, fb.inlineAnnotations);
    attachSelectionHandler(bubble, conv, turn);
    aMsg.appendChild(bubble);

    // context
    if (turn.context && turn.context.length) {
      const ctx = el("details", { class: "ctx" });
      const nCalls = turn.context.filter((c) => c.kind === "toolCall").length;
      ctx.appendChild(el("summary", { text: `Context — ${nCalls} tool call${nCalls === 1 ? "" : "s"} / retrieved data` }));
      const body = el("div", { class: "details-body" });
      for (const c of turn.context) {
        if (c.kind === "toolCall") body.appendChild(el("div", { class: "ctx-call", text: c.content }));
        else body.appendChild(el("div", { class: "ctx-summary", text: c.content }));
      }
      ctx.appendChild(body);
      aMsg.appendChild(ctx);
    }
    card.appendChild(aMsg);

    // feedback form
    card.appendChild(renderFeedbackForm(conv, turn, fb, bubble));
    return card;
  }

  function renderFeedbackForm(conv, turn, fb, bubble) {
    const form = el("div", { class: "feedback" });

    // satisfaction
    const satRow = el("div", { class: "fb-row" });
    satRow.appendChild(el("span", { class: "fb-label", text: "Satisfaction with the answer" }));
    const sat = el("div", { class: "satisfaction" });
    for (const opt of SAT_OPTIONS) {
      const b = el("button", { class: "sat-btn" + (fb.satisfaction === opt ? " on" : ""), "data-v": opt, type: "button", text: opt });
      b.addEventListener("click", () => {
        fb.satisfaction = fb.satisfaction === opt ? null : opt;
        sat.querySelectorAll(".sat-btn").forEach((x) => x.classList.toggle("on", x.getAttribute("data-v") === fb.satisfaction));
        scheduleSave(); renderProgress(); refreshSidebarCounts();
      });
      sat.appendChild(b);
    }
    satRow.appendChild(sat);
    form.appendChild(satRow);

    // good / bad
    const two = el("div", { class: "fb-row fb-two" });
    two.appendChild(textField("What was good", fb, "whatWasGood", conv, turn));
    two.appendChild(textField("What was bad", fb, "whatWasBad", conv, turn));
    form.appendChild(two);

    // resources
    form.appendChild(textFieldRow("Resources that should be mentioned", fb, "resourcesToMention", conv, turn));
    // further comments
    form.appendChild(textFieldRow("Further comments", fb, "furtherComments", conv, turn, true));

    // inline annotations list
    const annoRow = el("div", { class: "fb-row" });
    annoRow.appendChild(el("span", { class: "fb-label", html: 'Inline notes <span class="opt">— select any text in the answer above to add one</span>' }));
    const listWrap = el("div", { class: "anno-list" });
    renderAnnoList(listWrap, fb, bubble);
    annoRow.appendChild(listWrap);
    form.appendChild(annoRow);

    return form;
  }

  function renderAnnoList(listWrap, fb, bubble) {
    listWrap.innerHTML = "";
    if (!fb.inlineAnnotations.length) {
      listWrap.appendChild(el("div", { class: "c-sub", text: "No inline notes yet.", style: "color:var(--muted);font-size:12.5px" }));
      return;
    }
    for (const a of fb.inlineAnnotations) {
      if (!a._id) a._id = "a" + Math.random().toString(36).slice(2, 8);
      const chip = el("div", { class: "anno-chip", "data-anno-id": a._id });
      const cmt = el("div", { class: "cmt" });
      cmt.appendChild(el("div", { class: "quote", text: "“" + (a.quote || "").slice(0, 140) + ((a.quote || "").length > 140 ? "…" : "") + "”" }));
      cmt.appendChild(el("div", { text: a.comment }));
      chip.appendChild(cmt);
      chip.addEventListener("mouseenter", () => bubble && bubble.querySelectorAll("mark.anno").forEach((mk) => mk.classList.toggle("focus", mk._anno === a)));
      chip.addEventListener("mouseleave", () => bubble && bubble.querySelectorAll("mark.anno").forEach((mk) => mk.classList.remove("focus")));
      const del = el("button", { class: "del", title: "Remove note", text: "×" });
      del.addEventListener("click", () => {
        const i = fb.inlineAnnotations.indexOf(a);
        if (i >= 0) fb.inlineAnnotations.splice(i, 1);
        scheduleSave();
        renderContent();
      });
      chip.appendChild(del);
      listWrap.appendChild(chip);
    }
  }

  function textField(label, fb, key, conv, turn) {
    const wrap = el("div");
    wrap.appendChild(el("label", { class: "fb-label", text: label }));
    const ta = el("textarea", { class: "fb", placeholder: label + "…" });
    ta.value = fb[key] || "";
    ta.addEventListener("input", () => { fb[key] = ta.value; scheduleSave(); onFbInputDebounced(); });
    wrap.appendChild(ta);
    return wrap;
  }
  function textFieldRow(label, fb, key, conv, turn, optional) {
    const row = el("div", { class: "fb-row" });
    row.appendChild(el("label", { class: "fb-label", html: label + (optional ? ' <span class="opt">(optional)</span>' : "") }));
    const ta = el("textarea", { class: "fb", placeholder: label + "…" });
    ta.value = fb[key] || "";
    ta.addEventListener("input", () => { fb[key] = ta.value; scheduleSave(); onFbInputDebounced(); });
    row.appendChild(ta);
    return row;
  }

  let fbInputTimer = null;
  function onFbInputDebounced() {
    if (fbInputTimer) clearTimeout(fbInputTimer);
    fbInputTimer = setTimeout(() => { renderProgress(); refreshSidebarCounts(); }, 500);
  }

  function refreshSidebarCounts() {
    const items = document.querySelectorAll(".conv-item");
    items.forEach((item, i) => {
      const conv = conversations[i];
      if (!conv) return;
      const cc = convCounts(conv);
      const c = item.querySelector(".c-count");
      if (c) c.innerHTML = `<b>${cc.done}</b> / ${cc.total} answered`;
    });
  }

  function renderProgress() {
    const { done, total } = totalCounts();
    const chip = $("#progressChip");
    if (chip) chip.innerHTML = `<b>${done}</b> / ${total} answered`;
  }

  // ---------- File loading ----------
  function wireDrop(node) {
    node.addEventListener("dragover", (e) => { e.preventDefault(); node.classList.add("drag"); });
    node.addEventListener("dragleave", () => node.classList.remove("drag"));
    node.addEventListener("drop", (e) => {
      e.preventDefault();
      node.classList.remove("drag");
      handleFiles(e.dataTransfer.files);
    });
  }
  // allow dropping anywhere on the page too
  window.addEventListener("dragover", (e) => { e.preventDefault(); });
  window.addEventListener("drop", (e) => { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });

  async function handleFiles(fileList) {
    const files = Array.from(fileList || []).filter((f) => /\.json$/i.test(f.name) || f.type === "application/json");
    if (!files.length) return;
    const reports = [];
    for (const f of files) {
      try {
        const text = await f.text();
        const json = JSON.parse(text);
        // If it's a feedback export, import it instead of treating it as a conversation.
        if (json && json.schemaVersion && Array.isArray(json.conversations) && json.reviewer !== undefined) {
          importExport(json);
          continue;
        }
        reports.push({ id: f.name.replace(/\.[^.]+$/, ""), report: json });
      } catch (e) {
        alert("Could not read " + f.name + ": " + e.message);
      }
    }
    if (reports.length) {
      const added = addReports(reports);
      renderAll();
      if (added) { activeConvId = activeConvId || conversations[0].id; }
    }
  }

  // ---------- Wire header ----------
  function wireHeader() {
    $("#reviewerName").addEventListener("input", (e) => { reviewer.name = e.target.value; scheduleSave(); });
    $("#reviewerEmail").addEventListener("input", (e) => { reviewer.email = e.target.value; scheduleSave(); });
    $("#exportBtn").addEventListener("click", doExport);
    $("#importBtn").addEventListener("click", () => $("#importFile").click());
    $("#importFile").addEventListener("change", async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      try { importExport(JSON.parse(await f.text())); } catch (err) { alert("Could not import: " + err.message); }
      e.target.value = "";
    });
    $("#addFile").addEventListener("change", (e) => { handleFiles(e.target.files); e.target.value = ""; });
    window.addEventListener("beforeunload", saveNow);
  }

  // ---------- Boot ----------
  function boot() {
    wireHeader();
    let embedded = [];
    try {
      const raw = $("#conversations-data").textContent.trim();
      embedded = raw ? JSON.parse(raw) : [];
    } catch (e) { console.error("Failed to parse embedded conversations", e); }
    if (Array.isArray(embedded) && embedded.length) addReports(embedded);
    else { recomputeStorageKey(); loadFeedback(); }
    if (conversations.length && !activeConvId) activeConvId = conversations[0].id;
    renderAll();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
