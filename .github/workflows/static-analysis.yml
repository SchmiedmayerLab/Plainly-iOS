name: Static Analysis

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reuse_action:
    name: REUSE Compliance Check
    uses: SchmiedmayerLab/.github/.github/workflows/reuse.yml@v0.2
    permissions:
      contents: read
  swiftlint:
    name: SwiftLint
    uses: SchmiedmayerLab/.github/.github/workflows/swiftlint.yml@v0.2
    permissions:
      contents: read
  periphery:
    name: Periphery
    uses: SchmiedmayerLab/.github/.github/workflows/periphery.yml@v0.2
    permissions:
      contents: read
    with:
      runsonlabels: '["macOS", "self-hosted"]'
  markdownlinkcheck:
    name: Markdown Link Check
    uses: SchmiedmayerLab/.github/.github/workflows/markdown-links.yml@v0.2
    permissions:
      contents: read
  codeql:
    name: CodeQL
    uses: SchmiedmayerLab/.github/.github/workflows/xcodebuild.yml@v0.2
    permissions:
      security-events: write
      actions: read
      contents: read
    with:
      codeql: false
      scheme: AIHealthLiteracy
      test: false
